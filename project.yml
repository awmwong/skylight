name: Skylight
options:
  bundleIdPrefix: com.anthony
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_IDENTITY: "-"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  Skylight:
    type: application
    platform: macOS
    sources:
      - Sources/Skylight
      - Sources/SkylightSPI
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anthony.skylight
        SWIFT_OBJC_BRIDGING_HEADER: Sources/SkylightSPI/CGVirtualDisplaySPI.h
      configs:
        # Release only: hardened runtime blocks library injection into a
        # process that holds a standing Screen Recording grant. Debug stays
        # unhardened so xcodebuild test can inject the test bundle.
        Release:
          ENABLE_HARDENED_RUNTIME: true
    info:
      path: Sources/Skylight/Info.plist
      properties:
        CFBundleDisplayName: Skylight
        CFBundleIconFile: AppIcon
        LSUIElement: true
        NSScreenCaptureUsageDescription: >-
          Skylight captures the screen region you select so it can mirror it
          onto the Skylight virtual display for sharing.
  SkylightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SkylightTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Skylight
schemes:
  Skylight:
    build:
      targets:
        Skylight: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SkylightTests
